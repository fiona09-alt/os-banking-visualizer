<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BankOS Visualizer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">B</span><div><b>BankOS Visualizer</b><small>ATM transaction processing</small></div></div>
    <p class="side-note">Follow a transaction from the ATM to execution.</p>
    <nav>
      <button data-tab="pc" class="on"><i>1</i><span>Request buffer<small>Producer-Consumer</small></span></button>
      <button data-tab="sched"><i>2</i><span>Scheduler<small>CPU Scheduling</small></span></button>
      <button data-tab="mem"><i>3</i><span>Memory<small>First, Best, Worst Fit</small></span></button>
      <button data-tab="bank"><i>4</i><span>Resource check<small>Banker's Algorithm</small></span></button>
      <button data-tab="flow" class="final"><i>&#10003;</i><span>Full run<small>All four together</small></span></button>
    </nav>
    <p class="side-foot">Operating Systems, 5th Sem CSE<br>Assignment 3 and Practical 09</p>
  </aside>
  <main>
    <section id="pc"></section>
    <section id="sched" hidden></section>
    <section id="mem" hidden></section>
    <section id="bank" hidden></section>
    <section id="flow" hidden></section>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/scheduling.js"></script>
<script src="js/producer_consumer.js"></script>
<script src="js/memory.js"></script>
<script src="js/bankers.js"></script>
<script src="js/integration.js"></script>
<script src="js/app.js"></script>
</body>
</html>
